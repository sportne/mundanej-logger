name: native-image

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  native:
    name: GraalVM 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm
          native-image-job-reports: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Native smoke
        run: ./gradlew nativeSmoke --console=plain
