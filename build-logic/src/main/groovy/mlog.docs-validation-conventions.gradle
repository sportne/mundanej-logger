tasks.register('validateDesignControlPack') {
    group = 'verification'
    description = 'Validates that project governance documentation exists.'
    inputs.files(
        rootProject.file('docs/charter.md'),
        rootProject.file('docs/architecture/module-boundaries.md'),
        rootProject.file('docs/verification/architecture-gates.md'),
        rootProject.file('docs/verification/native-image.md'),
        rootProject.file('docs/roadmap.md')
    )
    doLast {
        inputs.files.files.each { candidate ->
            if (!candidate.isFile()) {
                throw new GradleException("Missing design control document: ${candidate}")
            }
        }
    }
}
